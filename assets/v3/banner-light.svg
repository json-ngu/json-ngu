<g clip-path="url(#c)">
  <rect width="1200" height="300" fill="url(#base)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g mask="url(#m)" opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><text x="56" y="44" xml:space="preserve"><tspan fill="#6e7781"># walk-forward backtest over daily bars</tspan></text><text x="56" y="65" xml:space="preserve"><tspan fill="#cf222e">def</tspan><tspan fill="#24292f"> </tspan><tspan fill="#8250df">backtest</tspan><tspan fill="#24292f">(prices, signal, cash=</tspan><tspan fill="#0550ae">10_000</tspan><tspan fill="#24292f">):</tspan></text><text x="56" y="86" xml:space="preserve"><tspan fill="#24292f">    position, equity = </tspan><tspan fill="#0550ae">0</tspan><tspan fill="#24292f">, []</tspan></text><text x="56" y="107" xml:space="preserve"><tspan fill="#24292f">    </tspan><tspan fill="#cf222e">for</tspan><tspan fill="#24292f"> t </tspan><tspan fill="#cf222e">in</tspan><tspan fill="#24292f"> </tspan><tspan fill="#8250df">range</tspan><tspan fill="#24292f">(</tspan><tspan fill="#0550ae">1</tspan><tspan fill="#24292f">, </tspan><tspan fill="#8250df">len</tspan><tspan fill="#24292f">(prices)):</tspan></text><text x="56" y="128" xml:space="preserve"><tspan fill="#24292f">        </tspan><tspan fill="#cf222e">if</tspan><tspan fill="#24292f"> signal[t - </tspan><tspan fill="#0550ae">1</tspan><tspan fill="#24292f">] &gt; </tspan><tspan fill="#0550ae">0</tspan><tspan fill="#24292f"> </tspan><tspan fill="#cf222e">and</tspan><tspan fill="#24292f"> position == </tspan><tspan fill="#0550ae">0</tspan><tspan fill="#24292f">:</tspan></text><text x="56" y="149" xml:space="preserve"><tspan fill="#24292f">            position = cash // prices[t]</tspan></text><text x="56" y="170" xml:space="preserve"><tspan fill="#24292f">            cash -= position * prices[t]</tspan></text><text x="56" y="191" xml:space="preserve"><tspan fill="#24292f">        </tspan><tspan fill="#cf222e">elif</tspan><tspan fill="#24292f"> signal[t - </tspan><tspan fill="#0550ae">1</tspan><tspan fill="#24292f">] &lt; </tspan><tspan fill="#0550ae">0</tspan><tspan fill="#24292f"> </tspan><tspan fill="#cf222e">and</tspan><tspan fill="#24292f"> position &gt; </tspan><tspan fill="#0550ae">0</tspan><tspan fill="#24292f">:</tspan></text><text x="56" y="212" xml:space="preserve"><tspan fill="#24292f">            cash += position * prices[t]</tspan></text><text x="56" y="233" xml:space="preserve"><tspan fill="#24292f">            position = </tspan><tspan fill="#0550ae">0</tspan></text><text x="56" y="254" xml:space="preserve"><tspan fill="#24292f">        equity.</tspan><tspan fill="#8250df">append</tspan><tspan fill="#24292f">(cash + position * prices[t])</tspan></text><text x="56" y="275" xml:space="preserve"><tspan fill="#24292f">    </tspan><tspan fill="#cf222e">return</tspan><tspan fill="#24292f"> equity</tspan></text></g>
</g>
