  <g mask="url(#m)" opacity="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><text x="56" y="44" xml:space="preserve"><tspan fill="#8b949e"># walk-forward backtest over daily bars</tspan></text><text x="56" y="65" xml:space="preserve"><tspan fill="#ff7b72">def</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#d2a8ff">backtest</tspan><tspan fill="#c9d1d9">(prices, signal, cash=</tspan><tspan fill="#79c0ff">10_000</tspan><tspan fill="#c9d1d9">):</tspan></text><text x="56" y="86" xml:space="preserve"><tspan fill="#c9d1d9">    position, equity = </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9">, []</tspan></text><text x="56" y="107" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff7b72">for</tspan><tspan fill="#c9d1d9"> t </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#d2a8ff">range</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#79c0ff">1</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#d2a8ff">len</tspan><tspan fill="#c9d1d9">(prices)):</tspan></text><text x="56" y="128" xml:space="preserve"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ff7b72">if</tspan><tspan fill="#c9d1d9"> signal[t - </tspan><tspan fill="#79c0ff">1</tspan><tspan fill="#c9d1d9">] &gt; </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">and</tspan><tspan fill="#c9d1d9"> position == </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9">:</tspan></text><text x="56" y="149" xml:space="preserve"><tspan fill="#c9d1d9">            position = cash // prices[t]</tspan></text><text x="56" y="170" xml:space="preserve"><tspan fill="#c9d1d9">            cash -= position * prices[t]</tspan></text><text x="56" y="191" xml:space="preserve"><tspan fill="#c9d1d9">        </tspan><tspan fill="#ff7b72">elif</tspan><tspan fill="#c9d1d9"> signal[t - </tspan><tspan fill="#79c0ff">1</tspan><tspan fill="#c9d1d9">] &lt; </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">and</tspan><tspan fill="#c9d1d9"> position &gt; </tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9">:</tspan></text><text x="56" y="212" xml:space="preserve"><tspan fill="#c9d1d9">            cash += position * prices[t]</tspan></text><text x="56" y="233" xml:space="preserve"><tspan fill="#c9d1d9">            position = </tspan><tspan fill="#79c0ff">0</tspan></text><text x="56" y="254" xml:space="preserve"><tspan fill="#c9d1d9">        equity.</tspan><tspan fill="#d2a8ff">append</tspan><tspan fill="#c9d1d9">(cash + position * prices[t])</tspan></text><text x="56" y="275" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#c9d1d9"> equity</tspan></text></g>
</g>
