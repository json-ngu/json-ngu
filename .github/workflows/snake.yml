name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # colors match the README's blue/gray badges: empty day -> busiest day
          outputs: |
            dist/snake-dark.svg?color_snake=#8fb8f0&color_dots=#161b22,#1b3a6b,#24508f,#2f6bc0,#5b93e0&color_dot_border=#0d1117
            dist/snake-light.svg?color_snake=#1b3a6b&color_dots=#ebeef3,#c9dcf7,#8fb3e8,#4a7fd0,#1b3a6b&color_dot_border=#ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
